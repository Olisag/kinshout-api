# Not scheduled. This copy writes to the dev API only.
name: Repair duplicate YouTube titles (dev)

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Rewrite collapsed YouTube titles on dev
        env:
          KINSHOUT_IMPORTER_IMPORT_KEY: ${{ secrets.KINSHOUT_IMPORTER_IMPORT_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sfS -X POST \
            "https://kinshout-api-dev.azurewebsites.net/api/imports/discussions/repair-duplicate-titles?limit=40" \
            -H "X-Kinshout-Import-Key: ${KINSHOUT_IMPORTER_IMPORT_KEY}" \
            -H "Content-Type: application/json")
          echo "$response"
          rewritten=$(echo "$response" | jq -r '.rewritten')
          failed=$(echo "$response" | jq -r '.failed')
          if [ "$failed" != "0" ]; then
            echo "Repair failed for ${failed} post(s)."
            exit 1
          fi
          echo "Rewritten ${rewritten}."
