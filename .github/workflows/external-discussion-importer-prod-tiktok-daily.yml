# TikTok registry handles daily at 04:30 Kinshasa (03:30 UTC). Cap is 16.
name: External discussion importer (prod, TikTok daily)

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-tiktok
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Run TikTok discussion import (prod)
        env:
          KINSHOUT_IMPORTER_API_BASE_URL: https://kinshout-api-prod.azurewebsites.net
          KINSHOUT_IMPORTER_IMPORT_KEY: ${{ secrets.KINSHOUT_IMPORTER_IMPORT_KEY }}
          KINSHOUT_IMPORTER_BATCH_SIZE: 25
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: dotnet run -- --once --discussions --providers tiktok
