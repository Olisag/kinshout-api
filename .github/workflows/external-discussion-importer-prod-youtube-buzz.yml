# Once a day. search.list costs 100 quota units per person, so this is not run every 6 hours.
# Official channels still arrive through WebSub and the 6-hour uploads poll.
name: External discussion importer (prod, YouTube buzz)

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-youtube-buzz
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Search buzzing YouTube videos (prod)
        env:
          KINSHOUT_IMPORTER_API_BASE_URL: https://kinshout-api-prod.azurewebsites.net
          KINSHOUT_IMPORTER_IMPORT_KEY: ${{ secrets.KINSHOUT_IMPORTER_IMPORT_KEY }}
          KINSHOUT_IMPORTER_BATCH_SIZE: 25
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: dotnet run -- --once --discussions --youtube-buzz
