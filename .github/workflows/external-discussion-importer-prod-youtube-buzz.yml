# Not scheduled. This copy writes to the dev API only.
name: External discussion importer (dev, YouTube buzz)

on:
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-youtube-buzz
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Search buzzing YouTube videos (dev)
        env:
          KINSHOUT_IMPORTER_API_BASE_URL: https://kinshout-api-dev.azurewebsites.net
          KINSHOUT_IMPORTER_IMPORT_KEY: ${{ secrets.KINSHOUT_IMPORTER_IMPORT_KEY }}
          KINSHOUT_IMPORTER_BATCH_SIZE: 25
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: dotnet run -- --once --discussions --youtube-buzz
