# Not scheduled. This copy writes to the dev API only.
name: External discussion importer (dev, YouTube WebSub)

on:
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-youtube-websub
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Renew YouTube WebSub (dev)
        env:
          YOUTUBE_WEBSUB_CALLBACK: https://kinshout-api-dev.azurewebsites.net/api/youtube/websub
          YOUTUBE_WEBSUB_SECRET: ${{ secrets.YOUTUBE_WEBSUB_SECRET }}
        run: dotnet run -- --youtube-websub
