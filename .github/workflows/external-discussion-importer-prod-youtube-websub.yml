# Renew YouTube WebSub leases every 6 days. The hub lease is about 10 days.
name: External discussion importer (prod, YouTube WebSub)

on:
  schedule:
    - cron: "19 4 */6 * *"
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-youtube-websub
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Renew YouTube WebSub (prod)
        env:
          YOUTUBE_WEBSUB_CALLBACK: https://kinshout-api-prod.azurewebsites.net/api/youtube/websub
          YOUTUBE_WEBSUB_SECRET: ${{ secrets.YOUTUBE_WEBSUB_SECRET }}
        run: dotnet run -- --youtube-websub
