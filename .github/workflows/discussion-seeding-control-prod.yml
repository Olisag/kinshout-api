name: Set production discussion seeding switch

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Enable automatic seeding for eligible imported discussions
        required: true
        type: boolean
        default: false

concurrency:
  group: discussion-seeding-control-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sign in with existing production deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_19F6DFAABDC747A8B8A57AA4357F3312 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BA0E7AC063D7423B93689D49C6E14B50 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4BFFEE8378E424FB38B9FDAFFB1C988 }}
      - name: Apply global developer switch
        env:
          SEEDING_ENABLED: ${{ inputs.enabled }}
        run: |
          set -euo pipefail
          settings=("DiscussionSeeding__Enabled=${SEEDING_ENABLED}")
          if [ "$SEEDING_ENABLED" = "true" ]; then
            settings+=("OpenAI__ModerationEnabled=true")
          fi
          az webapp config appsettings set \
            --resource-group Phpnet20211126011001ResourceGroup \
            --name kinshout-api-prod \
            --settings "${settings[@]}" \
            --output none
          echo "Production global seeding switch set to ${SEEDING_ENABLED}."
