name: Turn the production WhatsApp channel on or off

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: Publish scheduled Kinshasa updates to the Kinoiserie channel
        required: true
        type: boolean
        default: false

concurrency:
  group: whatsapp-channel-control-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    if: github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sign in with existing production deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_19F6DFAABDC747A8B8A57AA4357F3312 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BA0E7AC063D7423B93689D49C6E14B50 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A4BFFEE8378E424FB38B9FDAFFB1C988 }}
      - name: Apply the channel switch
        env:
          CHANNEL_ENABLED: ${{ inputs.enabled }}
          WAPITO_TOKEN: ${{ secrets.WAPITO_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL_ENABLED" = "true" ] && [ -z "$WAPITO_TOKEN" ]; then
            echo "The channel token secret is missing, so publishing was left unchanged."
            exit 1
          fi
          settings=("WhatsAppPublishing__Enabled=${CHANNEL_ENABLED}" "WhatsAppPublishing__DryRun=false")
          if [ -n "$WAPITO_TOKEN" ]; then
            settings+=("WhatsAppPublishing__WapitoToken=${WAPITO_TOKEN}")
          fi
          az webapp config appsettings set \
            --resource-group Phpnet20211126011001ResourceGroup \
            --name kinshout-api-prod \
            --settings "${settings[@]}" \
            --output none
          echo "Production WhatsApp publishing set to ${CHANNEL_ENABLED}."
