# Not scheduled. This copy writes to the dev API only.
name: External discussion importer (dev, drop unavailable)

on:
  workflow_dispatch:

concurrency:
  group: external-discussion-importer-prod-drop-unavailable
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: Kinshout.ExternalImporter

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Drop posts the source has removed (dev)
        env:
          KINSHOUT_IMPORTER_API_BASE_URL: https://kinshout-api-dev.azurewebsites.net
          KINSHOUT_IMPORTER_IMPORT_KEY: ${{ secrets.KINSHOUT_IMPORTER_IMPORT_KEY }}
        run: dotnet run -- --once --drop-unavailable
